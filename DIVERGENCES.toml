# Intended behaviour differences between Cornerman and the pinned Ringer oracle
# (vendor/ringer-py). The conformance suite reads this file and treats the listed cases
# as expected diffs. A difference that is not listed here is drift and fails the suite.
#
# One [[divergence]] table per difference:
#
# [[divergence]]
# case = "run/per-run-dashboard-port"   # conformance case id
# since = "2026-09-25"                   # date the divergence was accepted
# upstream_sha = "0be58d3"               # oracle SHA it was measured against
# fields = ["stderr"]                     # optional; default is all three
# reason = "Per-run dashboards on :8787+ are retired into the single LiveView endpoint."
#

# Fields: which of "status", "stdout", "stderr" may differ for the case; the rest must
# still match. A case whose exempt fields match again fails as stale.

[[divergence]]
case = "lint/error-invalid-json"
fields = ["stderr"]
since = "2026-09-26"
upstream_sha = "0be58d3"
reason = "The message after 'cornerman: error: ' is worded like Elixir's JSON.DecodeError (Cornerman.Py.Json keeps that wording since ENG-495), not like Python's json module. Exit status (2), empty stdout and the error prefix must still match."

# File divergence: `paths` lists globs (relative to the sealed home) whose files must exist
# in both implementations but whose contents may differ. `case` may end in "/*".
[[divergence]]
case = "run/*"
paths = ["**/*.html"]
since = "2026-09-26"
upstream_sha = "0be58d3"
reason = "The results pages (live status, final report, versions, runs index, file wrappers) are HTML rendered by Ringer's Python string templates. Cornerman renders them from HEEx components in phase 3 (plan: 'Final reports render from the same HEEx components'). Until then the same files must exist at the same paths, so links printed at the end of a run and stored in library.json resolve, but their markup is not compared."

[[divergence]]
case = "run/config-load-error"
fields = ["stderr"]
since = "2026-09-26"
upstream_sha = "0be58d3"
reason = "The message after 'cornerman: error: ' comes from Elixir's TOML parser, not Python's tomllib ('Invalid value (at line 1, column 14)'). Exit status (2), empty stdout, the prefix and a single line must still match."
